<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e8" />
    <script>
      // Apply the saved theme, or the operating-system preference, before first paint.
      try {
        const saved = localStorage.getItem("portfolio-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = saved === "light" || saved === "dark" ? saved : prefersDark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#121318" : "#f4f1e8";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio requires JavaScript. Contact me at adambiro2008@gmail.com or visit github.com/AdamDruszad.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
