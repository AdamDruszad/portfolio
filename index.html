<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181c17" />
    <script>
      try {
        const savedTheme = localStorage.getItem("portfolio-theme");
        const theme = savedTheme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#f5f4ef" : "#181c17";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio requires JavaScript. Contact me at adambiro2008@gmail.com or visit github.com/AdamDruszad.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
